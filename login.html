<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login | ISM Royal Trust Distributors</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="auth-page">

    <div class="left-section">

        <div class="auth-image login-image"></div>

        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>

    </div>

    <div class="auth-form-section">

        <div class="auth-form-box">

            <div class="mobile-logo">
                <img src="images/logo.png" alt="ISM Logo">
                <h2>ISM ROYAL TRUST DISTRIBUTORS</h2>
            </div>

            <div class="form-heading">
                <span>Welcome Back</span>
                <h1>Login to Your Account</h1>
                <p>Enter your account details to continue.</p>
            </div>

            <form id="loginForm">

                <div class="input-group">
                    <label for="loginEmail">Email Address</label>

                    <div class="input-box">
                        <i class="fas fa-envelope"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email address"
                        >
                    </div>

                    <small class="error-message" id="loginEmailError"></small>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Password</label>

                    <div class="input-box">
                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                            aria-label="Show password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <small class="error-message" id="loginPasswordError"></small>
                </div>

                <div class="form-options">

                    <label class="remember-box">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">Forgot Password?</a>

                </div>

                <button type="submit" class="auth-btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>

                <div id="loginMessage" class="form-message"></div>

            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">

                <button type="button">
                    <i class="fab fa-google"></i>
                    Google
                </button>

                <button type="button">
                    <i class="fab fa-facebook-f"></i>
                    Facebook
                </button>

            </div>

            <p class="switch-form">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

        </div>

    </div>

</div>

<script src="js/login.js"></script>
</body>
</html>
