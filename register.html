<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ISM Royal Trust Distributors</title>

    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/navbar-auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="auth-page">

    <div class="left-section">
        <div class="auth-image register-image"></div>

        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Back to Home
        </a>
    </div>

    <div class="auth-form-section">
        <div class="auth-form-box register-form-box">

            <div class="mobile-logo">
                <img src="images/logo.png" alt="ISM Logo">
                <h2>ISM ROYAL TRUST DISTRIBUTORS</h2>
            </div>

            <div class="form-heading">
                <span>Create Account</span>
                <h1>Register Your Account</h1>
                <p>Enter your details to create a new account.</p>
            </div>

            <form id="registerForm">

                <div class="input-group">
                    <label for="firstName">First Name</label>

                    <div class="input-box">
                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Enter your first name"
                            autocomplete="given-name"
                            required
                        >
                    </div>

                    <small
                        class="error-message"
                        id="firstNameError">
                    </small>
                </div>

                <div class="input-group">
                    <label for="lastName">Last Name</label>

                    <div class="input-box">
                        <i class="fas fa-user"></i>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Enter your last name"
                            autocomplete="family-name"
                            required
                        >
                    </div>

                    <small
                        class="error-message"
                        id="lastNameError">
                    </small>
                </div>

                <div class="input-group">
                    <label for="registerEmail">Email Address</label>

                    <div class="input-box">
                        <i class="fas fa-envelope"></i>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <small
                        class="error-message"
                        id="registerEmailError">
                    </small>
                </div>

                <div class="input-group">
                    <label for="registerPhone">Phone Number</label>

                    <div class="input-box">
                        <i class="fas fa-phone"></i>

                        <input
                            type="tel"
                            id="registerPhone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >
                    </div>

                    <small
                        class="error-message"
                        id="registerPhoneError">
                    </small>
                </div>

                <div class="input-group">
                    <label for="registerPassword">Password</label>

                    <div class="input-box">
                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="registerPassword"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="registerPassword"
                            aria-label="Show password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <small
                        class="error-message"
                        id="registerPasswordError">
                    </small>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <div class="input-box">
                        <i class="fas fa-lock"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                            aria-label="Show password"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <small
                        class="error-message"
                        id="confirmPasswordError">
                    </small>
                </div>

                <div class="terms-box">
                    <label>
                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >

                        <span>
                            I agree to the
                            <a href="#">Terms and Conditions</a>
                        </span>
                    </label>

                    <small
                        class="error-message"
                        id="termsError">
                    </small>
                </div>

                <button type="submit" class="auth-btn">
                    <span>Create Account</span>
                    <i class="fas fa-user-plus"></i>
                </button>

                <div
                    id="registerMessage"
                    class="form-message">
                </div>

            </form>

            <p class="switch-form">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>
    </div>

</div>

<script src="js/register.js"></script>


</body>
</html>
